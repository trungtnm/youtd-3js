# nginx site for YouTD Reforged on the VPS (/etc/nginx/sites-available/, linked from
# sites-enabled/). Traffic arrives through the Cloudflare proxy: conf.d/cloudflare-real-ip.conf
# restores the visitor address into $remote_addr, and $tfs_from_cloudflare
# (conf.d/cloudflare-origin.conf) drops anything that did not come through Cloudflare.
# The certificate is Let's Encrypt via webroot:
#   certbot certonly --webroot -w /var/www/letsencrypt -d youtd.0xtrungtran.com

server {
    listen 80;
    listen [::]:80;
    server_name youtd.0xtrungtran.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://youtd.0xtrungtran.com$request_uri; }
}

server {
    listen 194.233.86.144:443 ssl http2;
    server_name youtd.0xtrungtran.com;
    ssl_certificate     /etc/letsencrypt/live/youtd.0xtrungtran.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youtd.0xtrungtran.com/privkey.pem;
    if ($tfs_from_cloudflare = 0) { return 444; }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    # Run uploads are at most 512 KB gzip (worker/logs.js).
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The server reads the client address from X-Real-IP (TRUST_PROXY=1) for rate limits.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
